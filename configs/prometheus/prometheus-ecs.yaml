global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['172.17.0.1:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['172.17.0.1:9100']
        labels:
          instance: 'host'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['172.17.0.1:8080']
        labels:
          instance: 'containers'

  - job_name: 'fastapi-prompt-injection-app'
    static_configs:
      - targets: ['172.17.0.1:8000']
    metrics_path: '/metrics'